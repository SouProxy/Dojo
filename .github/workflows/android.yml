name: Android APK

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Menor privilégio por padrão; só o job de release pode escrever.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-tests:
    name: Testes da lógica e da UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    name: Build do APK
    needs: web-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar Gradle wrapper (anti supply-chain)
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar chave de assinatura (se configurada)
        env:
          KEYSTORE_B64: ${{ secrets.DOJO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DOJO_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Chave de release configurada."
          else
            echo "::warning::Sem segredo DOJO_KEYSTORE_BASE64: só o APK de debug será instalável. Veja o README."
          fi
      - name: Lint + build
        env:
          DOJO_KEYSTORE_PASSWORD: ${{ secrets.DOJO_KEYSTORE_PASSWORD }}
          DOJO_KEY_ALIAS: ${{ secrets.DOJO_KEY_ALIAS }}
          DOJO_KEY_PASSWORD: ${{ secrets.DOJO_KEY_PASSWORD }}
          DOJO_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon lintDebug assembleDebug assembleRelease
      - name: Organizar APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/dojo-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/dojo.apk
          fi
          rm -f "$RUNNER_TEMP/release.jks"
          (cd dist && sha256sum *.apk | tee SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: dojo-apk
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  emulator-smoke:
    name: Teste no emulador Android
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dojo-apk
          path: dist
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rodar app no emulador (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: mkdir -p smoke && bash tests/android-smoke.sh dist/dojo-debug.apk smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke
          path: smoke/
          if-no-files-found: ignore

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, emulator-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dojo-apk
          path: dist
      - name: Criar release com o APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Dojo $TAG" --notes "APK do app Dojo. Confira o SHA256SUMS.txt antes de instalar."
